# Add these locations INSIDE ddggdd.tech's existing HTTPS server block.
# Keep existing root, TLS settings, and all other location blocks.
# web and ddongko-team must share the Docker network specified by WEB_NETWORK.
location = /team { return 302 /team/; }
location ^~ /team/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $team_upstream http://ddongko-team:8080;
    proxy_pass $team_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
    add_header Cache-Control "no-store" always;
    # OAuth callback query contains a short-lived code. Do not record it.
    access_log off;
}
